<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#150d22">
    <title>PamRoomCats 🐱💻 — El juego de la tesis y los michis</title>
    
    <!-- Tipografías elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <!-- SQLite 3 WebAssembly (sql.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

    <!-- Phaser 3 CDN oficial -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <style>
        :root {
            --bg-color: #150d22;
            --card-bg: rgba(36, 24, 56, 0.85);
            --accent-pink: #ff80ab;
            --accent-yellow: #ffde59;
            --accent-green: #00e676;
            --border-glow: rgba(255, 128, 171, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(128, 203, 196, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 128, 171, 0.12) 0%, transparent 40%),
                linear-gradient(135deg, #12091c 0%, #1e1233 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            padding: 16px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ffde59, #ff80ab, #80cbc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(255, 128, 171, 0.3);
            letter-spacing: -0.5px;
        }

        .header-title p {
            color: #b39ddb;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        /* Banner de sugerencia de rotación para teléfonos en vertical */
        #rotate-hint {
            display: none;
            width: 100%;
            max-width: 960px;
            margin-bottom: 10px;
            background: rgba(36, 24, 56, 0.94);
            border: 1px solid rgba(255, 222, 89, 0.5);
            border-radius: 12px;
            padding: 8px 14px;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #ffe082;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
        }

        #rotate-hint .rotate-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 222, 89, 0.15);
            padding: 5px;
            border-radius: 8px;
            margin-right: 8px;
            animation: spinHint 3s ease-in-out infinite;
        }

        @keyframes spinHint {
            0%, 20% { transform: rotate(0deg); }
            50%, 70% { transform: rotate(90deg); }
            90%, 100% { transform: rotate(0deg); }
        }

        #rotate-hint .close-hint-btn {
            background: transparent;
            border: none;
            color: #b39ddb;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px 6px;
            line-height: 1;
        }

        #game-wrapper {
            position: relative;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 0 1px var(--border-glow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 984px;
            width: 100%;
        }

        #game-container {
            width: 960px;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #game-container canvas {
            display: block;
            image-rendering: pixelated;
            touch-action: none; /* Previene gestos del navegador sobre el lienzo */
            max-width: 100%;
            max-height: 100%;
        }

        .footer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 960px;
            margin-top: 14px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.88rem;
            color: #b0bec5;
        }

        .key-badge {
            background: #392b47;
            color: #ffde59;
            padding: 2px 7px;
            border-radius: 5px;
            font-weight: 700;
            border: 1px solid #ffde5944;
            margin: 0 2px;
        }

        .fs-button {
            background: rgba(255, 128, 171, 0.15);
            color: #ff80ab;
            border: 1px solid rgba(255, 128, 171, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.86rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            touch-action: manipulation;
        }

        .fs-button:hover {
            background: rgba(255, 128, 171, 0.3);
            border-color: #ff80ab;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 16px rgba(255, 128, 171, 0.4);
        }

        .fs-button:active {
            transform: translateY(0) scale(0.97);
        }

        /* Adaptación móvil total: 100% largo y ancho de la pantalla, sin barras negras ni márgenes */
        @media (max-width: 1024px), (max-height: 560px), (pointer: coarse) {
            html, body {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: hidden !important;
                background: #000 !important;
                justify-content: center !important;
            }

            .header-title,
            .footer-bar,
            #rotate-hint {
                display: none !important;
            }

            #game-wrapper {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                padding: 0 !important;
                margin: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                background: #000 !important;
                box-shadow: none !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
            }

            #game-container {
                width: 100vw !important;
                height: 100vh !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                border-radius: 0 !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                overflow: hidden !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
            }

            #game-container canvas {
                width: 100vw !important;
                height: 100vh !important;
                object-fit: fill !important;
                display: block !important;
                border-radius: 0 !important;
                margin: 0 !important;
                touch-action: none !important;
                image-rendering: pixelated !important;
            }
        }

        /* Estilos cuando está en Pantalla Completa del navegador activa */
        #game-wrapper:fullscreen,
        #game-wrapper:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            padding: 0 !important;
            margin: 0 !important;
            border-radius: 0 !important;
            border: none !important;
            box-shadow: none !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            background: #000 !important;
        }

        #game-wrapper:fullscreen #game-container,
        #game-wrapper:-webkit-full-screen #game-container {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            border-radius: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        #game-wrapper:fullscreen .footer-bar,
        #game-wrapper:-webkit-full-screen .footer-bar {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>PamRoomCats</h1>
        <p>Tesis vs Michis • Videojuego de Gestión y Multitarea</p>
    </div>

    <!-- Sugerencia visual en móviles verticales -->
    <div id="rotate-hint">
        <div style="display: flex; align-items: center;">
            <span class="rotate-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffe082" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
            </span>
            <span><b>Tip:</b> Gira tu teléfono en horizontal para disfrutar la pantalla completa y controles táctiles.</span>
        </div>
        <button id="close-hint-btn" class="close-hint-btn" title="Cerrar aviso">&times;</button>
    </div>

    <div id="game-wrapper">
        <div id="game-container"></div>
        
        <div class="footer-bar">
            <div id="controls-text">
                Controles: <span class="key-badge">WASD</span> / <span class="key-badge">Flechas</span> / <span class="key-badge">Clic</span> • <span class="key-badge">ESC</span> o <span class="key-badge">P</span> Pausa • <span class="key-badge">F</span> Pantalla Completa
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="fs-toggle-btn" class="fs-button" title="Alternar Pantalla Completa (Tecla F)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                    Pantalla Completa
                </button>
            </div>
        </div>
    </div>

    <!-- Script de Pantalla Completa, Detección Táctil y Sonido UI -->
    <script>
        function toggleFullScreen() {
            const wrapper = document.getElementById('game-wrapper');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen().catch(err => {
                        console.warn('Error al iniciar fullscreen:', err);
                    });
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                } else if (wrapper.msRequestFullscreen) {
                    wrapper.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        const fsBtn = document.getElementById('fs-toggle-btn');
        fsBtn.addEventListener('click', () => {
            if (window.AudioSys && window.AudioSys.playClick) window.AudioSys.playClick();
            toggleFullScreen();
        });
        fsBtn.addEventListener('mouseenter', () => {
            if (window.AudioSys && window.AudioSys.playHover) window.AudioSys.playHover();
        });

        const iconFsOpen = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg> Pantalla Completa`;
        const iconFsExit = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg> Salir Pantalla Completa`;

        const handleFsChange = () => {
            const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
            if (fsBtn) {
                fsBtn.innerHTML = isFs ? iconFsExit : iconFsOpen;
            }
            if (window.game && window.game.scale) {
                setTimeout(() => window.game.scale.refresh(), 100);
            }
        };

        document.addEventListener('fullscreenchange', handleFsChange);
        document.addEventListener('webkitfullscreenchange', handleFsChange);

        window.addEventListener('keydown', (e) => {
            if ((e.key === 'f' || e.key === 'F') && document.activeElement.tagName !== 'INPUT') {
                toggleFullScreen();
            }
        });

        window.toggleFullScreen = toggleFullScreen;

        // Detección de dispositivos táctiles o pantallas móviles para adaptar el texto de ayuda
        const updateControlsText = () => {
            const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.innerWidth < 900;
            const controlsHint = document.getElementById('controls-text');
            if (controlsHint && isTouch) {
                controlsHint.innerHTML = '📱 Controles táctiles: Toca el suelo o el <b>D-Pad</b> para moverte • Toca los michis y estaciones';
            }
        };
        updateControlsText();
        window.addEventListener('resize', updateControlsText);

        // Botón cerrar hint de rotación
        const closeHint = document.getElementById('close-hint-btn');
        if (closeHint) {
            closeHint.addEventListener('click', () => {
                const hintEl = document.getElementById('rotate-hint');
                if (hintEl) hintEl.style.display = 'none';
            });
        }

        // Refrescar tamaño de escala de Phaser en giros de pantalla
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (window.game && window.game.scale) {
                    window.game.scale.refresh();
                }
            }, 250);
        });
        window.addEventListener('resize', () => {
            if (window.game && window.game.scale) {
                window.game.scale.refresh();
            }
        });
    </script>

    <!-- Script principal de inicio modular -->
    <script type="module" src="src/main.js?v=2000"></script>

</body>
</html>
