<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PamRoomCats 🐱💻 — El juego de la tesis y los michis</title>
    
    <!-- Tipografías elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

    <!-- SQLite 3 WebAssembly (sql.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

    <!-- Phaser 3 CDN oficial -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <style>
        :root {
            --bg-color: #150d22;
            --card-bg: rgba(36, 24, 56, 0.85);
            --accent-pink: #ff80ab;
            --accent-yellow: #ffde59;
            --accent-green: #00e676;
            --border-glow: rgba(255, 128, 171, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(128, 203, 196, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 128, 171, 0.12) 0%, transparent 40%),
                linear-gradient(135deg, #12091c 0%, #1e1233 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
            padding: 16px;
        }

        .header-title {
            text-align: center;
            margin-bottom: 12px;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ffde59, #ff80ab, #80cbc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(255, 128, 171, 0.3);
            letter-spacing: -0.5px;
        }

        .header-title p {
            color: #b39ddb;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        #game-wrapper {
            position: relative;
            background: var(--card-bg);
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 0 1px var(--border-glow);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            width: 960px;
            height: 600px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        .footer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 960px;
            margin-top: 14px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.88rem;
            color: #b0bec5;
        }

        .key-badge {
            background: #392b47;
            color: #ffde59;
            padding: 2px 7px;
            border-radius: 5px;
            font-weight: 700;
            border: 1px solid #ffde5944;
            margin: 0 2px;
        }

        .sqlite-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 230, 118, 0.12);
            color: #00e676;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .sqlite-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #00e676;
            border-radius: 50%;
            box-shadow: 0 0 8px #00e676;
        }

        @media (max-width: 1024px) {
            #game-container {
                width: 100vw;
                height: 62.5vw;
                max-width: 960px;
                max-height: 600px;
            }
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>PamRoomCats 🐱</h1>
        <p>Tesis vs Michis • Videojuego de Gestión y Multitarea</p>
    </div>

    <div id="game-wrapper">
        <div id="game-container"></div>
        
        <div class="footer-bar">
            <div>
                🎮 Controles: <span class="key-badge">WASD</span> o <span class="key-badge">Flechas</span> o <span class="key-badge">Clic Izquierdo</span> para moverte e interactuar
            </div>
            <div class="sqlite-badge">
                SQLite 3 Activo
            </div>
        </div>
    </div>

    <!-- Script principal de inicio modular -->
    <script type="module" src="src/main.js"></script>

</body>
</html>
